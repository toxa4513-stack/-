<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карточка товара</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">
        <!-- Картинка товара -->
        <img src="product.jpg" alt="Товар" class="card-image">

        <div class="card-content">
            <h2 class="card-title">Замовити тортик на подарунок</h2>
            <p class="card-description">
         Можете замовити тортик на подарунок з будьяким дизайном та смаком який ви забажаете       
            </p>

            <button id="orderBtn" class="btn">Заказать</button>
        </div>
    </div>

    <!-- Модальное окно с формой заказа -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <span id="closeBtn" class="close">&times;</span>
            <h3>Параметры заказа</h3>
            
            <form id="orderForm">
                <div class="form-group">
                    <label for="weight">Вес (кг):</label>
                    <input type="number" id="weight" step="0.1" placeholder="Например: 2.5" required>
                </div>

                <div class="form-group">
                    <label for="height">Высота (см):</label>
                    <input type="number" id="height" placeholder="Например: 50" required>
                </div>

                <div class="form-group">
                    <label for="width">Ширина (см):</label>
                    <input type="number" id="width" placeholder="Например: 30" required>
                </div>

                <button type="submit" class="btn btn-submit">Подтвердить заказ</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
